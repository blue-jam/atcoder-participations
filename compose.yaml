services:
  api:
    build: .
    environment:
      DATABASE_URL: sqlite:////data/atcoder.db
      ATCODER_USER_AGENT: "${ATCODER_USER_AGENT:-atcoder-participations/0.1 (contact: admin@example.com)}"
      SYNC_INTERVAL_HOURS: ${SYNC_INTERVAL_HOURS:-6}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - atcoder_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
volumes:
  atcoder_data:

