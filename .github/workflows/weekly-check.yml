name: Weekly participation check

on:
  schedule:
    # GitHub Actions cron is UTC. 14:00 UTC is Monday 23:00 JST.
    - cron: "0 14 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-participation-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install --no-deps .
      - run: atcoder-participations
        env:
          ATCODER_USER_AGENT: "${{ vars.ATCODER_USER_AGENT || 'atcoder-participations/0.1 (contact: blue_jam)' }}"
          ATCODER_USERNAME: ${{ vars.ATCODER_USERNAME || 'blue_jam' }}
          TARGET_CONTEST_CLASSES: ${{ vars.TARGET_CONTEST_CLASSES || 'abc' }}
          WEBHOOK_VALUE1: ${{ vars.WEBHOOK_VALUE1 || 'You missed the contest.' }}
          WEBHOOK_VALUE2: ${{ vars.WEBHOOK_VALUE2 }}
          WEBHOOK_VALUE3: ${{ vars.WEBHOOK_VALUE3 }}
          WARNING_WEBHOOK_URL: ${{ secrets.WARNING_WEBHOOK_URL }}
          PENALTY_WEBHOOK_URL: ${{ secrets.PENALTY_WEBHOOK_URL }}
