[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atcoder-participations"
version = "0.1.0"
description = "Typed API for AtCoder contest participation history"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.17.1",
  "beautifulsoup4==4.14.2",
  "fastapi==0.121.0",
  "httpx==0.28.1",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.55",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "ruff==0.14.3",
]

[project.scripts]
atcoder-participations = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

